<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
<title id="t">Where the rules are enforced</title>
<desc id="d">Five layers, from a git hook on your machine to GitHub branch protection. Hooks can be skipped; CI and branch protection cannot.</desc>
<rect width="960" height="440" fill="#eef0f3"/>
<text x="48" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" fill="#5d6470" text-anchor="start">Layer</text>
<text x="250" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" fill="#5d6470" text-anchor="start">What it checks</text>
<text x="740" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" fill="#5d6470" text-anchor="start">Can it be skipped?</text>
<rect x="32" y="62" width="896" height="58" fill="#fff"/>
<text x="48" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" fill="#0b0c0e" text-anchor="start">commit-msg hook</text>
<text x="250" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#0b0c0e" text-anchor="start">Conventional Commits; no attribution trailers</text>
<text x="740" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#5d6470" text-anchor="start">yes: --no-verify</text>
<rect x="32" y="128" width="896" height="58" fill="#fff"/>
<text x="48" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" fill="#0b0c0e" text-anchor="start">pre-commit hook</text>
<text x="250" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#0b0c0e" text-anchor="start">no commit on the default branch</text>
<text x="740" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#5d6470" text-anchor="start">yes: --no-verify</text>
<rect x="32" y="194" width="896" height="58" fill="#fff"/>
<text x="48" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" fill="#0b0c0e" text-anchor="start">pre-push hook</text>
<text x="250" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#0b0c0e" text-anchor="start">no push to the default branch; the quality gate</text>
<text x="740" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#5d6470" text-anchor="start">yes: --no-verify</text>
<rect x="32" y="260" width="896" height="58" fill="#1f2de6"/>
<text x="48" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" fill="#fff" text-anchor="start">CI</text>
<text x="250" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#fff" text-anchor="start">the gate per component, commits, PR title, CodeQL</text>
<text x="740" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#fff" text-anchor="start">no</text>
<rect x="32" y="326" width="896" height="58" fill="#1f2de6"/>
<text x="48" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" fill="#fff" text-anchor="start">Branch protection</text>
<text x="250" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#fff" text-anchor="start">required checks; no direct push (you enable it)</text>
<text x="740" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#fff" text-anchor="start">only administrators</text>
<text x="40" y="414" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#0b0c0e" text-anchor="start">Hooks are a convenience on one machine. CI and branch protection are the rule.</text>
</svg>
