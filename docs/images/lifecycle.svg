<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
<title id="t">From init to upgrade</title>
<desc id="d">init writes the files and a record of them. Later, upgrade compares your files, the record and the new templates, and updates, keeps or sets aside each file.</desc>
<rect width="960" height="330" fill="#eef0f3"/>
<rect x="32" y="40" width="230" height="92" fill="#fff"/>
<text x="50" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="600" fill="#0b0c0e" text-anchor="start">init</text>
<text x="50" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#5d6470" text-anchor="start">look · ask · preview · write</text>
<rect x="330" y="40" width="270" height="92" fill="#fff"/>
<text x="348" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="600" fill="#0b0c0e" text-anchor="start">The files + a record</text>
<text x="348" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#5d6470" text-anchor="start">answers and a hash of each file</text>
<rect x="668" y="40" width="260" height="92" fill="#1f2de6"/>
<text x="686" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="600" fill="#fff" text-anchor="start">Later: new templates</text>
<text x="686" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#dfe2ff" text-anchor="start">the skill was updated</text>
<path d="M266 86 H322" stroke="#0b0c0e" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/><path d="M316 79 l9 7 -9 7" fill="none" stroke="#0b0c0e" stroke-width="2.5"/>
<path d="M604 86 H660" stroke="#0b0c0e" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/><path d="M654 79 l9 7 -9 7" fill="none" stroke="#0b0c0e" stroke-width="2.5"/>
<text x="32" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#0b0c0e" text-anchor="start">upgrade compares three things for every file: what init recorded, what you have now, what the templates produce.</text>
<rect x="32" y="222" width="280" height="84" fill="#1f2de6"/>
<text x="48" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start">As generated, template changed</text>
<text x="48" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start">updated  (--apply)</text>
<rect x="332" y="222" width="280" height="84" fill="#0b0c0e"/>
<text x="348" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start">Edited by you, template same</text>
<text x="348" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start">kept as it is</text>
<rect x="632" y="222" width="280" height="84" fill="#fff"/>
<text x="648" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="600" fill="#0b0c0e" text-anchor="start">Edited by you, template changed</text>
<text x="648" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#5d6470" text-anchor="start">kept; the new one sits beside it</text>
</svg>
